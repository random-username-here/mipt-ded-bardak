###
### Sample server configuration
###
### Paths are relative to the config file
### There can be multiple mod_path's and pan_path's
### tick_time is in milliseconds, tick_time = 1000 => 1 second per tick
###

port = 3000
server_name = A sample server
mods_dir = build/
pan_dir = ./specs/proto/srv.pan
pan_dir = ./specs/proto/role.pan
pan_dir = ./mods/characters/ghost/proto/ghost.pan
pan_dir = ./mods/characters/pacman/proto/pacman.pan
pan_dir = ./mods/characters/person/proto/person.pan
