###
### Sample server configuration
###
### Paths are relative to the config file
### There can be multiple mod_path's and pan_path's
### tick_time is in milliseconds, tick_time = 1000 => 1 second per tick
###

port = 3000
server_name = A sample server
mods_path = ../../build/
pan_path = ../../
tick_time = 1000

# Enable when debugging
#log_file = ./msva.log

# Lobby module settings

# Game starts after this many selected clients are waiting
lobby_players = 3

# Number of server ticks to wait after enough clients queue
lobby_start_delay_ticks = 3

# Whether to disconnect finished-match clients after publishing lobby:finish
lobby_kick_finished_clients = true
