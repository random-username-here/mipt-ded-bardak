name: build action
on: [push, pull_request]
jobs:
  build-cmake:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libinih-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev
      - name: raylib
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake ..
          make
          sudo make install RAYLIB_LIBTYPE=SHARED
          sudo ldconfig
      - name: clone
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        run: |
          cmake -S . -B build -D CMAKE_BUILD_TYPE=${{matrix.build_type}} -D CMAKE_CXX_COMPILER=${{matrix.compiler}} -D BUILD_GRAPHICS=OFF
          cmake --build build
  tests:
    needs: build-cmake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    if: ${{ success() }}
    steps:
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libinih-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxcursor-dev libxinerama-dev
      - name: raylib
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake ..
          make
          sudo make install RAYLIB_LIBTYPE=SHARED
          sudo ldconfig
      - name: clone
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        run: |
          cmake -S . -B build -D CMAKE_BUILD_TYPE=${{matrix.build_type}} -D CMAKE_CXX_COMPILER=${{matrix.compiler}} -D BUILD_GRAPHICS=OFF
          cmake --build build
      - name: test
        run: |
          SERVER_IP=$(hostname -I | awk '{print $1}')
          ./build/servers/msva/msva ./servers/msva/sample.ini &
          SERVER_PID=$!

          sleep 2

          ./build/clients/person/person_client ./clients/person/default.ini &
          CLIENT_FIRST_PID=$!

          ./build/clients/person/person_client ./clients/person/default.ini &
          CLIENT_SECOND_PID=$!

          ./build/clients/person/person_client ./clients/person/default.ini &
          CLIENT_THIRD_PID=$!

          sleep 6

          kill $CLIENT_FIRST_PID 2>/dev/null || true
          wait $CLIENT_FIRST_PID 2>/dev/null || true

          kill $CLIENT_SECOND_PID 2>/dev/null || true
          wait $CLIENT_SECOND_PID 2>/dev/null || true

          kill $CLIENT_THIRD_PID 2>/dev/null || true
          wait $CLIENT_THIRD_PID 2>/dev/null || true

          kill $SERVER_PID 2>/dev/null
          wait $SERVER_PID 2>/dev/null
          SERVER_RESULT=$?

          exit $SERVER_RESULT

  footjob:
    needs: [build-cmake, tests]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: chill-drill
        run: |
          echo Hello foot world
